<style>
    :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --text-main: #1f2937;
        --text-muted: #4b5563;
        --bg-light: #f9fafb;
        --success: #10b981;
        --warning: #f59e0b;
    }
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    html {
        scroll-behavior: smooth;
    }
    body {
        background-color: var(--bg-light);
        color: var(--text-main);
        padding: 2rem;
        min-height: 100vh;
    }
    .contact-section {
        background: white;
        max-width: 600px;
        margin: 5rem auto 2rem auto;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        border: 1px solid #e5e7eb;
    }
    .form-group {
        margin-bottom: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .form-group label {
        font-weight: 600;
        color: var(--text-main);
    }
    .form-group input, .form-group textarea, .form-group select {
        padding: 0.8rem;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 1rem;
        width: 100%;
        background: white;
    }
    .radio-group {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        margin-top: 0.3rem;
    }
    .radio-option {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.8rem;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        cursor: pointer;
    }
    .submit-btn {
        width: 100%;
        background: var(--primary);
        color: white;
        padding: 1rem;
        border: none;
        border-radius: 6px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
    }
    .submit-btn:hover {
        background: var(--primary-dark);
    }
</style>
<!-- خانة الاسم الكريم -->
<div class="form-group">
    <label>الاسم الكريم</label>
    <input type="text" name="name" placeholder="اكتب اسمك هنا" required>
</div>

<!-- خانة البريد الإلكتروني -->
<div class="form-group">
    <label>بريدك الإلكتروني</label>
    <input type="email" name="_replyto" placeholder="name@example.com" required>
</div>
<!-- أزرار الاختيار الدائرية لخيارات الرد والطلب -->
<div class="form-group">
    <label>خيارات الرد والطلب (اختر الباقة المطلوبة):</label>
    <div class="radio-group">
        <label class="radio-option">
            <input type="radio" name="service_type" id="radioPlan1" value="الباقة الأساسية (49 ريال)" required>
            <span>الباقة الأساسية - 49 ريال (حتى 50 ملف)</span>
        </label>
        <label class="radio-option">
            <input type="radio" name="service_type" id="radioPlan2" value="الباقة المتقدمة (99 ريال)">
            <span>الباقة المتقدمة - 99 ريال (حتى 150 ملف)</span>
        </label>
        <label class="radio-option">
            <input type="radio" name="service_type" id="radioPlan3" value="باقة الأرشفة الدورية (199 ريال)">
            <span>باقة الأرشفة الدورية - 199 ريال (دورية شهرية)</span>
        </label>
        <label class="radio-option">
            <input type="radio" name="service_type" id="radioPlan4" value="كتابة رأي وتقييم فقط">
            <span>كتابة رأي وتقييم فقط لـ JOSHAE</span>
        </label>
    </div>
</div>
<!-- تقييم النجوم (اختياري) -->
<div class="form-group">
    <label>تقييمك للخدمة بالنجوم (اختياري)</label>
    <select name="rating">
        <option value="بدون تقييم">اختر التقييم بالنجوم...</option>
        <option value="5 نجوم">★★★★★ (ممتاز جداً)</option>
        <option value="4 نجوم">★★★★☆ (جيد جدا)</option>
        <option value="3 نجوم">★★★☆☆ (متوسط)</option>
    </select>
</div>

<!-- خانة التعليقات وتفاصيل الوصف الحُر -->
<div class="form-group">
    <label>تفاصيل طلبك أو تعليقك ورأيك الحُر</label>
    <textarea name="details" rows="4" placeholder="اكتب تفاصيل طلبك أو شاركنا تجربتك ورأيك بـ JOSHAE هنا..." required></textarea>
</div>

<!-- زر إرسال الرد الصريح والنهائي -->
<button type="submit" class="submit-btn">إرسال الرد</button>
<script>
    function selectPlan(planId) {
        if(planId === 'plan1') {
            document.getElementById('radioPlan1').checked = true;
        } else if(planId === 'plan2') {
            document.getElementById('radioPlan2').checked = true;
        } else if(planId === 'plan3') {
            document.getElementById('radioPlan3').checked = true;
        }
        document.getElementById('orderFormSection').scrollIntoView({ behavior: 'smooth' });
    }
</script>
