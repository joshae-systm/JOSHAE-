<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOSHAE - تنظيم رقمي لمشروعك</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #212529;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 20px;
            }
            .hero-image {
                order: 2;
            }
        }

        .brand-name {
            font-size: 3.5rem;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .main-heading {
            font-size: 2.2rem;
            font-weight: 700;
            color: #2d3748;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .sub-heading {
            font-size: 1.3rem;
            color: #718096;
            margin-bottom: 35px;
            font-weight: 400;
        }

        .cta-btn {
            display: inline-block;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .cta-btn:hover {
            background-color: #333333;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* Mockup Laptop Representation */
        .mockup-laptop {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 16 / 10;
            background: #e2e8f0;
            border: 12px solid #2d3748;
            border-radius: 16px 16px 0 0;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mockup-base {
            width: 120%;
            height: 12px;
            background: #a0aec0;
            margin-right: -10%;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .screen-content {
            flex: 1;
            background: #ffffff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .window-header {
            display: flex;
            gap: 6px;
            margin-bottom: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e0;
        }

        .dot.red { background: #fc8181; }
        .dot.yellow { background: #f6e05e; }
        .dot.green { background: #68d391; }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .file-box {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .file-icon {
            width: 20px;
            height: 24px;
            background: #4a5568;
            border-radius: 3px;
            position: relative;
        }

        .file-icon::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-bottom-left-radius: 3px;
        }

        .file-line {
            width: 60%;
            height: 4px;
            background: #cbd5e0;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hero-text">
            <h1 class="brand-name">JOSHAE</h1>
            <h2 class="main-heading">نرتّب ملفات مشروعك، لتصل لكل شيء بسهولة.</h2>
            <p class="sub-heading">تنظيم رقمي واضح وبسيط لمشروعك.</p>
            <a href="#" class="cta-btn">ابدأ الآن</a>
        </div>
        
        <div class="hero-image">
            <div class="image-container">
                <div>
                    <div class="mockup-laptop">
                        <div class="screen-content">
                            <div class="window-header">
                                <div class="dot red"></div>
                                <div class="dot yellow"></div>
                                <div class="dot green"></div>
                            </div>
                            <div style="width: 40%; height: 10px; background: #e2e8f0; margin-bottom: 10px; border-radius: 4px;"></div>
                            <div class="file-grid">
                                <div class="file-box"><div class="file-icon"></div><div class="file-line"></div></div>
                                <div class="file-box"><div class="file-icon" style="background: #3182ce;"></div><div class="file-line"></div></div>
                                <div class="file-box"><div class="file-icon"></div><div class="file-line"></div></div>
                                <div class="file-box"><div class="file-icon" style="background: #38a169;"></div><div class="file-line"></div></div>
                                <div class="file-box"><div class="file-icon"></div><div class="file-line"></div></div>
                                <div class="file-box"><div class="file-icon"></div><div class="file-line"></div></div>
                                <div class="file-box"><div class="file-icon"></div><div class="file-line"></div></div>
                                <div class="file-box"><div class="file-icon"></div><div class="file-line"></div></div>
                            </div>
                        </div>
                    </div>
                    <div class="mockup-base"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
