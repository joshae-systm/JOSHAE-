<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOSHAE - منصتك الرقمية المنظمة</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-light: #2563eb;
            --text-main: #0f172a;
            --text-muted: #475569;
            --bg-site: #f8fafc;
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-site);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
        }

        .main-wrapper {
            max-width: 1140px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3rem;
        }

        @media (max-width: 968px) {
            .main-wrapper {
                flex-direction: column-reverse;
                text-align: center;
                gap: 2.5rem;
            }
            .content-side {
                align-items: center !important;
            }
            .features-list {
                grid-template-columns: 1fr !important;
                width: 100%;
            }
            .stats-bar {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 1.5rem !important;
                margin-top: 3rem;
            }
            .main-heading {
                font-size: 2.2rem !important;
            }
            .mockup-folders-grid {
                grid-template-columns: repeat(3, 1fr) !important; /* يجبر المجلدات تظل 3 جنب بعض بالجوال عشان ما تطول الشاشة */
                gap: 0.5rem !important;
            }
            .mockup-folder {
                padding: 0.6rem 0.3rem !important;
                font-size: 0.65rem !important;
            }
        }

        .content-side {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
        }

        .badge-brand {
            color: var(--primary-light);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .main-heading {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1.25;
            color: #0f172a;
            margin-bottom: 1.5rem;
        }

        .main-heading span {
            color: var(--primary-light);
        }

        .sub-text {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 2.5rem;
            max-width: 540px;
        }

        .features-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 3rem;
            width: 100%;
        }

        .feature-item {
            background: white;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.01);
        }

        .feature-icon {
            font-size: 1.3rem;
            background: #f1f5f9;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
      .feature-info {
            text-align: right;
        }

        .feature-info strong {
            display: block;
            font-size: 0.85rem;
            color: #0f172a;
        }

        .feature-info span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            background: var(--primary-light);
            color: white;
            padding: 1.1rem 2.8rem;
            font-size: 1.15rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
            margin-bottom: 2rem;
            width: auto;
        }

        @media (max-width: 480px) {
            .btn-cta {
                width: 100%; /* زر كبير مريح ليد مستخدم الجوال */
            }
        }

        .btn-cta:hover {
            background: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.3);
        }

        .visual-side {
            flex: 0.9;
            display: flex;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        .mockup-laptop {
            background: #ffffff;
            border: 14px solid #0f172a;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 460px;
            aspect-ratio: 16 / 11;
            box-shadow: var(--card-shadow);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            position: relative;
        }

        .mockup-screen-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
        }

        .mockup-screen-title::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 12px 0 0 #f59e0b, 24px 0 0 #10b981;
            margin-right: 35px;
        }

        .mockup-folders-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
        }

        .mockup-folder {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.8rem 0.4rem;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #334155;
        }

        .mockup-folder span {
            color: #2563eb;
            font-size: 1.5rem;
            display: block;
            margin-bottom: 0.3rem;
        }

        .mockup-laptop-base {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 112%;
            height: 12px;
            background: #475569;
            border-radius: 0 0 12px 12px;
        }

        .shield-badge {
            position: absolute;
            bottom: -20px;
            right: 5%;
            background: var(--primary-light);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }
      .stats-bar {
            width: 100%;
            max-width: 1140px;
            border-top: 1px solid #e2e8f0;
            padding-top: 2.5rem;
            margin-top: 4rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        }

        .stat-card {
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-light);
            margin-bottom: 0.2rem;
        }

        .stat-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <!-- الجانب الأيمن التسويقي الجذاب -->
        <div class="content-side">
            <div class="badge-brand">● وكالة JOSHAE للتنظيم الرقمي</div>
            
            <h1 class="main-heading">
                رتب مساحتك الرقمية...
                <span>وخلك دائماً مسيطر على ملفاتك</span>
            </h1>
            
            <p class="sub-text">نساعد أصحاب المشاريع والمتاجر الناشئة في فرز وهيكلة ملفات الـ Google Drive وحمايتها لضمان سهولة الوصول والإنتاجية العالية.</p>
            
            <div class="features-list">
                <div class="feature-item">
                    <div class="feature-icon">🔒</div>
                    <div class="feature-info">
                        <strong>أمان بنسبة 100%</strong>
                        <span>حماية وخصوصية تامة</span>
                    </div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">⚡</div>
                    <div class="feature-info">
                        <strong>سرعة في الوصول</strong>
                        <span>توفر وقتك وجهدك</span>
                    </div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📂</div>
                    <div class="feature-info">
