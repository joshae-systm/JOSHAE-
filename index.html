<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOSHAE - التنظيم الرقمي</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Tahoma, sans-serif;
    background: #ffffff;
    color: #172033;
}

.hero {
    min-height: 100vh;
    padding: 25px 6%;
    background:
        radial-gradient(circle at 75% 45%, #eef4ff 0%, #ffffff 42%);
}

/* الهيدر */
.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 20px;
    border-bottom: 1px solid #edf0f5;
}

.logo {
    font-size: 38px;
    font-weight: 800;
    color: #1769e0;
    direction: ltr;
}

.nav-links {
    display: flex;
    gap: 35px;
}

.nav-links a {
    text-decoration: none;
    color: #5b6473;
    font-size: 16px;
    font-weight: 600;
}

.nav-links a:first-child {
    color: #1769e0;
}

.nav-btn {
    padding: 13px 25px;
    border: 1.5px solid #1769e0;
    border-radius: 12px;
    background: white;
    color: #1769e0;
    font-weight: bold;
    cursor: pointer;
}

/* القسم الرئيسي */
.hero-content {
    max-width: 1250px;
    margin: 70px auto 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 55px;
    align-items: center;
}

.badge {
    display: inline-block;
    padding: 12px 20px;
    border: 1px solid #dce7fa;
    border-radius: 30px;
    color: #303b4e;
    background: #fff;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(20,80,160,.05);
}

.badge span {
    color: #1769e0;
    font-weight: bold;
}

/* العنوان */
h1 {
    font-size: clamp(40px, 5vw, 68px);
    line-height: 1.25;
    font-weight: 800;
    margin-bottom: 25px;
}

h1 .blue {
    color: #1769e0;
}

.description {

    font-size: 18px;
    line-height: 2;
    max-width: 620px;
}
