<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOSHAE - وكالة التنظيم والأرشفة الرقمية</title>
    <style>
        :root {
            --primary: #1769e0;
            --primary-dark: #0f52b8;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --bg-light: #f9fafb;
            --white: #ffffff;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        html { 
            scroll-behavior: smooth; 
        }

        body { 
            background-color: var(--bg-light); 
            color: var(--text-main); 
            line-height: 1.6;
            padding: 0;
            margin: 0;
        }

        /* 📋 شريط الهيدر العلوي المكتمل بالخيارات الثلاثة */
        .nav-bar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #e5e7eb;
            background: var(--white);
        }

        .brand-name { 
            font-size: 2rem; 
            font-weight: 800; 
            color: var(--primary); 
            text-decoration: none; 
        }

        .nav-links { 
            display: flex; 
            gap: 1.5rem; 
            list-style: none; 
            align-items: center;
        }

        .nav-links a { 
            color: var(--text-muted); 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 1rem; 
            transition: color 0.2s; 
        }

        .nav-links a:hover { 
            color: var(--primary); 
        }

        .header-btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* ✨ حاوية الواجهة الرئيسية الناعمة والمصفاة بالكامل */
        .main-hero-container {
            max-width: 800px;
            margin: 6rem auto;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            align-items: center;
            text-align: center;
        }

        .hero-badge {
            background: #e0ecfb;
            color: var(--primary);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            width: fit-content;
            border: 1px solid #cbd5e1;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.4;
            max-width: 750px;
        }

        .hero-title span { color: var(--primary); }

        .main-btn {
            background: var(--primary);
            color: var(--white);
            padding: 1.2rem 3.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 12px rgba(23, 105, 224, 0.35);
            transition: all 0.2s;
            text-align: center;
            margin-top: 1rem;
        }

        .main-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }

        @media (max-width: 600px) {
            .hero-title { font-size: 2.2rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <!-- 📋 شريط الهيدر المكتمل بالخيارات الثلاثة الموزونة للأعلى -->
    <nav class="nav-bar">
        <a href="index.html" class="brand-name">JOSHAE</a>
        <ul class="nav-links">
            <li><a href="services.html#about-us">خدماتنا</a></li>
            <li><a href="services.html#pricing">الباقات والأسعار</a></li>
            <li><a href="services.html#contact-us">اطلب الآن</a></li>
            <li><a href="services.html#contact-us" class="header-btn">طلب خدمة الآن</a></li>
        </ul>
    </nav>

    <!-- 🚀 حاوية الواجهة الملكية النظيفة والمفتوحة بدون حوسة -->
    <main class="main-hero-container">
        
        <div class="hero-badge">✨ أول وكالة تنظيم رقمي للمتاجر الإلكترونية</div>
        <h1 class="hero-title">ننهي فوضى الـ Google Drive لمتجرك لترفع <span>إنتاجيتك ومبيعاتك!</span></h1>
        
        <!-- الزر الأزرق الكبير الفخم الموجه لصفحة الخدمات مباشرة -->
        <a href="services.html" class="main-btn">تصفح الخدمات والباقات ←</a>

    </main>

</body>
</html>
