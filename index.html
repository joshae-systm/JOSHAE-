<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOSHAE - وكالة التنظيم والأرشفة الرقمية</title>
    <style>
        :root {
            --primary: #1769e0;
            --primary-dark: #0f52b8;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --bg-light: #f9fafb;
            --white: #ffffff;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        html { 
            scroll-behavior: smooth; 
        }

        body { 
            background-color: var(--bg-light); 
            color: var(--text-main); 
            line-height: 1.6;
            padding: 0;
            margin: 0;
        }

        /* 📋 شريط الهيدر العلوي المكتمل بالخيارات الثلاثة */
        .nav-bar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #e5e7eb;
            background: var(--white);
        }

        .brand-name { 
            font-size: 2rem; 
            font-weight: 800; 
            color: var(--primary); 
            text-decoration: none; 
        }

        .nav-links { 
            display: flex; 
            gap: 1.5rem; 
            list-style: none; 
            align-items: center;
        }

        .nav-links a { 
            color: var(--text-muted); 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 1rem; 
            transition: color 0.2s; 
        }

        .nav-links a:hover { 
            color: var(--primary); 
        }

        .header-btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* ✨ حاوية الواجهة الرئيسية المفرودة الموزونة بالملي */
        .main-hero-container {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 3rem;
            align-items: center;
        }

        .content-side {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .hero-badge {
            background: #e0ecfb;
            color: var(--primary);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            width: fit-content;
            border: 1px solid #cbd5e1;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.3;
        }

        .hero-title span { color: var(--primary); }

        .main-btn {
            background: var(--primary);
            color: var(--white);
            padding: 1.2rem 3rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            width: fit-content;
            box-shadow: 0 4px 10px rgba(23, 105, 224, 0.3);
            transition: all 0.2s;
            text-align: center;
        }

        .main-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }

        /* 💻 الجزء المرئي المحسّن للابتوب والمجلدات الستة الملونة بالملي الحين الحين */
        .visual-side {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .laptop-container {
            position: relative;
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            z-index: 2;
        }

        .screen-header {
            background: #f1f5f9;
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
        }

        .screen-dots { display: flex; gap: 0.4rem; }
        .screen-dots span { width: 10px; height: 10px; border-radius: 50%; display: block; }
        .drive { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }

        .folders-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            padding: 1.5rem;
            background: #f8fafc;
        }

        /* 🌈 كود الألوان الحية والبارزة للمجلدات لكسر الجمود البصري للأبد */
        .folder-box {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s;
        }
        .folder-box:hover { transform: translateY(-3px); }
        .folder-box small { font-size: 0.9rem; font-weight: 700; color: var(--text-main); display: block; margin-top: 0.3rem; }

        .shield-badge {
            position: absolute;
            bottom: 10px;
            left: 20px;
            background: #10b981;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
            animation: bounce 2s infinite;
            z-index: 3;
        }

        .cloud-decor {
            position: absolute;
            top: 0px;
            right: 10px;
            font-size: 2.5rem;
            opacity: 0.3;
            animation: float 4s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        @media (max-width: 900px) {
            .main-hero-container { grid-template-columns: 1fr !important; text-align: center; margin: 2rem auto; }
            .hero-badge, .main-btn { margin: 0 auto; }
            .visual-side { padding-top: 2rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <!-- 📋 شريط الهيدر المطور بالكامل بالخيارات الثلاثة وزر الخدمة -->
    <nav class="nav-bar">
        <a href="index.html" class="brand-name">JOSHAE</a>
        <ul class="nav-links">
            <li><a href="services.html#about-us">خدماتنا</a></li>
            <li><a href="services.html#pricing">الباقات والأسعار</a></li>
            <li><a href="services.html#contact-us">اطلب الآن</a></li>
            <li><a href="services.html#contact-us" class="header-btn">طلب خدمة الآن</a></li>
        </ul>
    </nav>

    <!-- 🚀 حاوية الواجهة المحدثة الملوّنة مئة بالمئة للعملاء الحين الحين -->
    <main class="main-hero-container">
        
        <!-- الجهة اليمنى: النص المصفى والزر الموجه فقط -->
        <div class="content-side">
            <div class="hero-badge">✨ أول وكالة تنظيم رقمي للمتاجر الإلكترونية</div>
            <h1 class="hero-title">ننهي فوضى الـ Google Drive لمتجرك لترفع <span>إنتاجيتك ومبيعاتك!</span></h1>
            
            <a href="services.html" class="main-btn">تصفح الخدمات والباقات ←</a>
        </div>
        <!-- الجهة اليسرى: لابتوب Google Drive والمجلدات الستة الملونة بألوان مبهجة وفخمة بالملي -->
        <div class="visual-side">
            <div class="laptop-container">
                <div class="screen-header">
                    <div class="screen-dots">
                        <span style="background: #ef4444;"></span>
                        <span style="background: #f59e0b;"></span>
                        <span style="background: #10b981;"></span>
                    </div>
                    <div class="drive">Google Drive - JOSHAE</div>
                </div>

                <div class="folders-grid">
                    <div class="folder-box"><span style="color: #2563eb; font-size: 2.2rem; display: block;">📁</span><small>صور المنتجات</small></div>
                    <div class="folder-box"><span style="color: #16a34a; font-size: 2.2rem; display: block;">📁</span><small>الفواتير</small></div>
                    <div class="folder-box"><span style="color: #ca8a04; font-size: 2.2rem; display: block;">📁</span><small>التسويق</small></div>
                    <div class="folder-box"><span style="color: #7c3aed; font-size: 2.2rem; display: block;">📁</span><small>التقارير</small></div>
                    <div class="folder-box"><span style="color: #ea580c; font-size: 2.2rem; display: block;">📁</span><small>ملفات العملاء</small></div>
                    <div class="folder-box"><span style="color: #dc2626; font-size: 2.2rem; display: block;">📁</span><small>المستندات</small></div>
                </div>
            </div>
            <div class="shield-badge">✓</div>
            <div class="cloud-decor">☁️</div>
        </div>

    </main>

</body>
</html>
