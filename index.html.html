<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOSHAE - تنظيم رقمي ذكي</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --bg-light: #f9fafb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .content-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .brand-name {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .main-heading {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-main);
        }

        .sub-heading {
            font-size: 1.2rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .cta-button {
            display: inline-block;
            width: fit-content;
            background-color: var(--primary);
            color: white;
            padding: 0.8rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .cta-button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .visual-section {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .laptop-mockup {
            position: relative;
            width: 100%;
            max-width: 500px;
            perspective: 1000px;
        }

        .laptop-screen {
            background: #000;
            border: 12px solid #2d3748;
            border-radius: 16px 16px 0 0;
            aspect-ratio: 16 / 10;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        .system-ui {
            width: 100%;
            height: 100%;
            background: #ffffff;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .system-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 0.5rem;
        }

        .window-dots {
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-r { background: #ef4444; }
        .dot-y { background: #f59e0b; }
        .dot-g { background: #10b981; }

        .system-search {
            width: 120px;
            height: 14px;
            background: #f3f4f6;
            border-radius: 4px;
        }

        .grid-files {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            flex-grow: 1;
        }
.folder-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .folder-icon {
            width: 24px;
            height: 20px;
            background: #fcd34d;
            border-radius: 4px;
            position: relative;
        }
        .folder-icon::before {
            content: '';
            position: absolute;
            top: -4px;
            left: 0;
            width: 10px;
            height: 4px;
            background: #fcd34d;
            border-radius: 2px 2px 0 0;
        }

        .file-line {
            height: 6px;
            background: #cbd5e1;
            border-radius: 2px;
        }
        .file-line.short { width: 60%; }
        .file-line.long { width: 85%; }

        .laptop-base {
            height: 12px;
            background: #a0aec0;
            border-radius: 0 0 12px 12px;
            position: relative;
        }
        .laptop-base::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: #718096;
            border-radius: 0 0 4px 4px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 3rem;
                text-align: center;
            }
            .content-section {
                align-items: center;
            }
            .main-heading {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="content-section">
            <div class="brand-name">JOSHAE</div>
            <h1 class="main-heading">نرتّب ملفات مشروعك، لتصل لكل شيء بسهولة.</h1>
            <p class="sub-heading">تنظيم رقمي واضح وبسيط لمشروعك.</p>
            <!-- تم ربط الرابط المباشر هنا لحل مشكلة ظهور الأكواد -->
            <a href="https://netlify.app" class="cta-button">ابدأ الآن</a>
        </div>

        <div class="visual-section">
            <div class="laptop-mockup">
                <div class="laptop-screen">
                    <div class="system-ui">
                        <div class="system-header">
                            <div class="window-dots">
                                <span class="dot dot-r"></span>
                                <span class="dot dot-y"></span>
                                <span class="dot dot-g"></span>
                            </div>
                            <div class="system-search"></div>
                        </div>
                        <div class="grid-files">
                            <div class="folder-card"><div class="folder-icon"></div><div class="file-line long"></div><div class="file-line short"></div></div>
                            <div class="folder-card"><div class="folder-icon" style="background: #60a5fa;"></div><div class="file-line long"></div><div class="file-line short"></div></div>
                            <div class="folder-card"><div class="folder-icon"></div><div class="file-line long"></div><div class="file-line short"></div></div>
                            <div class="folder-card"><div class="folder-icon"></div><div class="file-line long"></div><div class="file-line short"></div></div>
                            <div class="folder-card"><div class="folder-icon" style="background: #34d399;"></div><div class="file-line long"></div><div class="file-line short"></div></div>
                            <div class="folder-card"><div class="folder-icon"></div><div class="file-line long"></div><div class="file-line short"></div></div>
                        </div>
                    </div>
                </div>
                <div class="laptop-base"></div>
            </div>
        </div>
    </div>

</body>
</html>
